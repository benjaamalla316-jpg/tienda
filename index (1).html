<style>:root{color-scheme:light}html,body{margin:0;padding:0}img{max-width:100%}</style><title>Venta iPhone Buceo</title></head><body>
<style id="app-css">/* Venta.iPhone.Buceo — estilos de la tienda */
:root {
  --paper: #ffffff;
  --fog: #f4f5f7;
  --fog-2: #e8eaee;
  --line: #dfe2e7;
  --ink: #15171b;
  --ink-2: #4a4f58;
  --ink-3: #7a808b;
  --blue: #1558ff;
  --blue-dark: #0e43cc;
  --sky: #4da3f0;
  --sky-soft: #e6f2fe;
  --green: #12923f;
  --green-soft: #e3f6ea;
  --coral: #ff5a4e;
  --coral-soft: #ffeceb;
  --amber: #a86a00;
  --amber-soft: #fff3da;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(21, 23, 27, .05), 0 8px 24px rgba(21, 23, 27, .06);
  --shadow-lg: 0 2px 6px rgba(21, 23, 27, .06), 0 24px 56px rgba(21, 23, 27, .12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --header-h: 60px;
  --gutter: 16px;
  --maxw: 1180px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 12px); }
body {
  margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px;
  font-weight: 650; font-size: 15px; letter-spacing: .01em;
  background: var(--blue); color: #fff; transition: background .18s, transform .1s, box-shadow .18s;
}
.btn:hover { background: var(--blue-dark); }
.btn:active { transform: scale(.98); }
.btn[disabled] { background: var(--fog-2); color: var(--ink-3); cursor: not-allowed; transform: none; }
.btn-dark { background: var(--ink); }
.btn-dark:hover { background: #000; }
.btn-ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn-ghost:hover { background: var(--ink); color: #fff; }
.btn-soft { background: var(--fog); color: var(--ink); }
.btn-soft:hover { background: var(--fog-2); }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 16px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }
.btn-wa { background: #0f7a3a; }
.btn-wa:hover { background: #0b5f2d; }

/* ---------- Encabezado ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  background: rgba(255, 255, 255, .86); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { height: 100%; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand img { width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
.nav { display: none; margin-left: 12px; gap: 4px; }
.nav a { padding: 8px 12px; border-radius: 999px; font-size: 14.5px; color: var(--ink-2); font-weight: 520; transition: background .15s, color .15s; }
.nav a:hover { background: var(--fog); color: var(--ink); }
.nav a.active { color: var(--ink); background: var(--fog); font-weight: 650; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.icon-btn {
  position: relative; width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 50%; transition: background .15s;
}
.icon-btn:hover { background: var(--fog); }
.icon-btn svg { width: 22px; height: 22px; }
.badge {
  position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700;
  display: grid; place-items: center; line-height: 1;
}
.badge[hidden] { display: none; }
.menu-btn { display: grid; }
.mobile-menu {
  position: fixed; inset: var(--header-h) 0 0 0; z-index: 49; background: var(--paper);
  padding: 12px var(--gutter) 32px; display: none; overflow-y: auto;
}
.mobile-menu.open { display: block; }
.mobile-menu > a { display: block; padding: 16px 4px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; border-bottom: 1px solid var(--line); }
.mobile-menu .mm-contact { margin-top: 24px; display: grid; gap: 10px; }
@media (min-width: 900px) {
  .nav { display: flex; }
  .menu-btn { display: none; }
  .mobile-menu { display: none !important; }
}

/* ---------- Búsqueda ---------- */
.search-panel {
  position: fixed; inset: 0; z-index: 80; background: rgba(21, 23, 27, .45); display: none;
  align-items: flex-start; justify-content: center; padding: 12px;
}
.search-panel.open { display: flex; }
.search-box {
  width: 100%; max-width: 640px; background: var(--paper); border-radius: 20px; box-shadow: var(--shadow-lg);
  overflow: hidden; margin-top: 8px;
}
.search-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 18px; border-bottom: 1px solid var(--line); }
.search-row svg { width: 20px; height: 20px; color: var(--ink-3); flex: none; }
.search-row input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 17px; min-height: 48px; background: transparent; min-width: 0; }
.search-results { max-height: min(60vh, 440px); overflow-y: auto; padding: 8px; }
.search-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; }
.search-item:hover, .search-item:focus-visible { background: var(--fog); }
.search-item .thumb { width: 52px; height: 52px; border-radius: 50%; background: var(--sky-soft); display: grid; place-items: center; overflow: hidden; flex: none; }
.search-item .thumb img, .search-item .thumb svg { width: 100%; height: 100%; object-fit: cover; }
.search-item .thumb svg { width: 60%; height: auto; }
.search-item b { display: block; font-weight: 650; font-size: 15px; }
.search-item span { color: var(--ink-3); font-size: 13.5px; }
.search-hint { padding: 20px; color: var(--ink-3); font-size: 14.5px; text-align: center; }

/* ---------- Banner principal ---------- */
.hero { position: relative; overflow: hidden; background: var(--paper); }
.hero .wrap { display: grid; gap: 8px; padding-top: 36px; padding-bottom: 28px; }
.hero-copy { position: relative; z-index: 2; max-width: 560px; }
.hero h1 {
  font-size: clamp(40px, 11vw, 78px); line-height: .96; font-weight: 850; letter-spacing: -.045em;
  text-wrap: balance;
}
.hero p.lead { margin-top: 18px; font-size: clamp(16px, 2.2vw, 19px); color: var(--ink-2); max-width: 46ch; }
.hero-cta { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
.hero-art { position: relative; height: 340px; margin: 0 -16px; }
.hero-disc {
  position: absolute; width: 330px; height: 330px; border-radius: 50%; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 30% 22%, #a9d6ff 0%, var(--sky) 38%, #2f7de6 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25);
}
.hero-phone { position: absolute; filter: drop-shadow(0 22px 28px rgba(10, 30, 80, .28)); }
.hero-phone svg { width: 100%; height: auto; }
.hp-left { width: 118px; left: 50%; top: 44px; margin-left: -168px; transform: rotate(-9deg); }
.hp-mid { width: 142px; left: 50%; top: 14px; margin-left: -71px; z-index: 2; }
.hp-right { width: 118px; left: 50%; top: 52px; margin-left: 50px; transform: rotate(8deg); }
@keyframes rise { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }
.hero-phone { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
.hp-mid { animation-delay: .05s; }
.hp-left { animation-delay: .2s; }
.hp-right { animation-delay: .32s; }
@media (min-width: 900px) {
  .hero .wrap { grid-template-columns: 1.05fr 1fr; align-items: center; padding-top: 56px; padding-bottom: 56px; gap: 24px; }
  .hero-art { height: 520px; margin: 0; }
  .hero-disc { width: 500px; height: 500px; }
  .hp-left { width: 180px; top: 96px; margin-left: -262px; }
  .hp-mid { width: 218px; top: 30px; margin-left: -109px; }
  .hp-right { width: 180px; top: 108px; margin-left: 80px; }
}

/* ---------- Ventajas ---------- */
.perks { background: var(--fog); }
.perks ul { list-style: none; margin: 0; padding: 18px var(--gutter); display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; max-width: var(--maxw); margin: 0 auto; }
.perks li { display: flex; align-items: flex-start; gap: 10px; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.perks .dot { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; color: var(--blue); box-shadow: var(--shadow); }
.perks .dot svg { width: 18px; height: 18px; }
@media (min-width: 900px) { .perks ul { grid-template-columns: repeat(4, 1fr); padding-top: 22px; padding-bottom: 22px; } .perks li { font-size: 15.5px; align-items: center; } }

/* ---------- Secciones ---------- */
.section { padding: 44px 0 8px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.section-head h2 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
.section-head p { color: var(--ink-3); font-size: 15px; margin-top: 6px; }
.link-more { font-weight: 650; font-size: 15px; color: var(--blue); white-space: nowrap; padding: 8px 0; }
.link-more:hover { text-decoration: underline; }
.empty-box {
  background: var(--fog); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--ink-2);
}
.empty-box b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 4px; letter-spacing: -.01em; }
.empty-box .btn { margin-top: 14px; }

/* ---------- Tarjetas de producto ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
.card {
  position: relative; display: flex; flex-direction: column; background: var(--paper); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--fog-2);
}
.card-media { position: relative; display: block; aspect-ratio: 1 / 1; background: var(--fog); overflow: hidden; }
.card-media::before {
  content: ""; position: absolute; width: 74%; aspect-ratio: 1; border-radius: 50%; left: 13%; top: 13%;
  background: radial-gradient(circle at 30% 25%, #ffffff 0%, var(--sky-soft) 60%, #cfe6fb 100%);
}
.card-media img, .card-media .ph { position: relative; width: 100%; height: 100%; object-fit: contain; padding: 10%; }
.card-media .ph { display: grid; place-items: center; padding: 14%; }
.card-media .ph svg { height: 100%; width: auto; }
.card.sold-out .card-media img, .card.sold-out .card-media .ph { opacity: .45; filter: grayscale(.6); }
.tags { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; z-index: 2; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--ink); color: #fff; line-height: 1.5; }
.tag.used { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tag.offer { background: var(--coral); }
.fav-btn {
  position: absolute; top: 6px; right: 6px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: rgba(255, 255, 255, .85); display: grid; place-items: center; transition: transform .12s;
}
.fav-btn:active { transform: scale(.9); }
.fav-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.9; }
.fav-btn[aria-pressed="true"] svg { fill: var(--coral); stroke: var(--coral); }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card-title { font-weight: 700; font-size: 16px; letter-spacing: -.015em; line-height: 1.25; }
.card-sub { color: var(--ink-3); font-size: 13.5px; }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }
.price { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.price-old { font-size: 14px; color: var(--ink-3); text-decoration: line-through; }
.stock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-top: 2px; }
.stock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.stock.low { color: var(--amber); }
.stock.low::before { background: #e59a1a; }
.stock.out { color: var(--ink-3); }
.stock.out::before { background: var(--ink-3); }
.stock.ok { color: var(--green); }
.card-actions { margin-top: auto; padding-top: 10px; }

/* ---------- Catálogo ---------- */
.page-head { padding: 30px 0 6px; }
.page-head h1 { font-size: clamp(32px, 7vw, 52px); font-weight: 850; letter-spacing: -.04em; line-height: 1; }
.page-head p { color: var(--ink-2); margin-top: 10px; max-width: 56ch; }
.filters { display: grid; gap: 10px; padding: 18px 0 8px; position: relative; }
.filters-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field, .select {
  min-height: 44px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; color: var(--ink);
}
.field:focus, .select:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21, 88, 255, .15); }
.chip {
  min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper);
  font-size: 14px; font-weight: 600; color: var(--ink-2); transition: all .15s;
}
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.checkline { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--ink-2); min-height: 38px; }
.checkline input { width: 18px; height: 18px; accent-color: var(--blue); }
.result-count { color: var(--ink-3); font-size: 14px; padding: 6px 0 14px; }
.catalog { padding-bottom: 40px; }

/* ---------- Ficha de producto ---------- */
.crumbs { padding: 18px 0 6px; font-size: 14px; color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.pdp { display: grid; gap: 22px; padding: 8px 0 24px; }
@media (min-width: 900px) { .pdp { grid-template-columns: 1.1fr 1fr; gap: 48px; padding-top: 16px; align-items: start; } .pdp-info { position: sticky; top: calc(var(--header-h) + 20px); } }
.gallery-main { position: relative; aspect-ratio: 1 / 1; border-radius: 24px; background: var(--fog); overflow: hidden; display: grid; place-items: center; }
.gallery-main::before {
  content: ""; position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, #ffffff 0%, var(--sky-soft) 58%, #c5e1fa 100%);
}
.gallery-main img { position: relative; width: 100%; height: 100%; object-fit: contain; padding: 6%; }
.gallery-main .ph { position: relative; height: 82%; }
.gallery-main .ph svg { height: 100%; width: auto; }
.thumbs { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.thumbs button { flex: none; width: 68px; height: 68px; border-radius: 14px; border: 2px solid transparent; padding: 0; background: var(--fog); overflow: hidden; }
.thumbs button[aria-current="true"] { border-color: var(--blue); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.pdp-info h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 850; letter-spacing: -.04em; line-height: 1.04; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.pill { padding: 5px 12px; border-radius: 999px; background: var(--fog); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.pill.new { background: var(--ink); color: #fff; }
.pdp-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.pdp-price .price { font-size: 34px; letter-spacing: -.035em; }
.pdp-price .price-old { font-size: 18px; }
.save-badge { background: var(--coral-soft); color: #c2362b; font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; }
.pdp-desc { margin-top: 18px; color: var(--ink-2); white-space: pre-line; max-width: 60ch; }
.buy-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; }
.qty button { width: 42px; height: 44px; border: 0; background: transparent; font-size: 20px; border-radius: 999px; }
.qty button:hover:not([disabled]) { background: var(--fog); }
.qty button[disabled] { color: var(--ink-3); cursor: not-allowed; }
.qty span { min-width: 28px; text-align: center; font-weight: 700; }
.buy-row .btn { flex: 1; min-width: 170px; }
.info-list { margin-top: 26px; display: grid; gap: 12px; }
.info-list div { border-top: 1px solid var(--line); padding-top: 12px; }
.info-list b { display: block; font-size: 15px; }
.info-list p { color: var(--ink-2); font-size: 14.5px; margin-top: 2px; white-space: pre-line; }

/* ---------- Carrito y pedido ---------- */
.two-col { display: grid; gap: 24px; padding: 8px 0 48px; }
@media (min-width: 900px) { .two-col { grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: start; } .summary { position: sticky; top: calc(var(--header-h) + 20px); } }
.line { display: grid; grid-template-columns: 84px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.line-img { width: 84px; height: 84px; border-radius: 16px; background: var(--fog); display: grid; place-items: center; overflow: hidden; }
.line-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.line-img svg { height: 82%; width: auto; }
.line b { font-weight: 700; letter-spacing: -.01em; }
.line .sub { color: var(--ink-3); font-size: 14px; }
.line-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.line .qty button { height: 38px; width: 38px; }
.link-btn { border: 0; background: none; color: var(--ink-3); font-size: 14px; text-decoration: underline; padding: 8px 4px; }
.link-btn:hover { color: var(--coral); }
.summary { background: var(--fog); border-radius: 20px; padding: 20px; }
.summary h2 { font-size: 20px; letter-spacing: -.02em; margin-bottom: 12px; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 15px; color: var(--ink-2); }
.sum-row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
.summary .btn { margin-top: 16px; }
.note { font-size: 13.5px; color: var(--ink-3); margin-top: 12px; }
.form { display: grid; gap: 18px; }
.form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; }
.form legend { font-weight: 750; font-size: 19px; letter-spacing: -.02em; margin-bottom: 4px; padding: 0; }
.form label.lbl { display: grid; gap: 6px; font-size: 14.5px; font-weight: 600; }
.form label.lbl small { font-weight: 400; color: var(--ink-3); }
.form .field { width: 100%; }
textarea.field { padding: 12px 14px; min-height: 90px; resize: vertical; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 15px; }
.opt:has(input:checked) { border-color: var(--blue); background: var(--sky-soft); }
.opt input { width: 20px; height: 20px; accent-color: var(--blue); flex: none; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.alert { padding: 12px 14px; border-radius: 12px; font-size: 14.5px; background: var(--coral-soft); color: #9d2a21; }
.alert.info { background: var(--sky-soft); color: #14518f; }
.done { text-align: center; padding: 44px 0 56px; max-width: 560px; margin: 0 auto; }

    const line = cart.find((l) => l.id === id); const have = line ? line.qty : 0;
    if (max <= 0) return toast('Este producto está agotado.');
    if (have >= max) return toast(`Ya tenés todas las unidades disponibles (${max}).`, { href: '#carrito', text: 'Ver carrito' });
    const next = Math.min(max, have + qty);
    if (line) line.qty = next; else cart.push({ id, qty: next });
    saveCart(); toast('Agregado al carrito', { href: '#carrito', text: 'Ver carrito' });
  }

  // ----- Carrito -----
  function loadCart() {
    const issues = []; let changed = false;
    cart = cart.filter((l) => { const p = byId(l.id); if (p && p.active) return true; changed = true; issues.push('Quitamos del carrito un producto que ya no está disponible.'); return false; });
    const lines = cart.map((l) => {
      const p = byId(l.id);
      if (p.stock > 0 && l.qty > p.stock) { l.qty = p.stock; changed = true; issues.push(`Ajustamos la cantidad de ${productLabel(p)} al stock disponible (${p.stock}).`); }
      const pp = { ...p, currency: curOf(p) };
      return { p: pp, qty: l.qty, sub: Math.round(p.price * l.qty * 100) / 100 };
    });
    if (changed) saveCart();
    const soldOut = lines.filter((x) => x.p.stock <= 0);
    if (soldOut.length) issues.push('Hay productos agotados en tu carrito. Quitalos para continuar.');
    const currencies = [...new Set(lines.map((x) => x.p.currency))];
    if (currencies.length > 1) issues.push('Tu carrito mezcla productos con monedas distintas. Hacé pedidos separados.');
    const total = lines.filter((x) => x.p.stock > 0).reduce((a, x) => a + x.sub, 0);
    return { lines, total: Math.round(total * 100) / 100, currency: currencies[0] || cfg().currency || '', issues, blocking: soldOut.length > 0 || currencies.length > 1 };
  }
  const priced = (c) => !!c.currency;
  function itemsText(c) {
    return c.lines.filter((x) => x.p.stock > 0).map((x) => `- ${x.qty} x ${productLabel(x.p)} (${x.p.condition})${priced(c) ? ': ' + money(x.sub, x.p.currency) : ''}`).join('\n');
  }

  async function toBlob(file) {
    const bmp = await createImageBitmap(file); const max = 1400; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const enc = (type, q) => new Promise((res) => c.toBlob(res, type, q));
    let b = await enc('image/webp', .86);
    if (!b || b.type !== 'image/webp') b = await enc('image/jpeg', .85); // Safari no genera WEBP
    if (!b) throw new Error('No se pudo procesar la imagen.');
    return b;
  }

    html`${!n ? html`<button class="btn btn-danger spacer" type="button" id="ff-del">Eliminar</button>` : ''}<button class="btn btn-soft" type="button" data-close>Cancelar</button><button class="btn" type="submit" form="ff">Aplicar</button>`);
    $('#ff').addEventListener('submit', (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const q = String(fd.get('question')).trim(); const a = String(fd.get('answer')).trim();
      if (!q || !a) { const er = $('#ff-err'); er.textContent = 'Completá la pregunta y la respuesta.'; er.hidden = false; return; }
      const out = { id: n ? Math.max(0, ...draft.faqs.map((x) => x.id)) + 1 : d.id, question: q, answer: a, active: fd.has('active') };
      draft.faqs = n ? [...draft.faqs, out] : draft.faqs.map((x) => (x.id === out.id ? out : x));
      dlg().close(); mark();
    });
    const del = $('#ff-del');
    if (del) del.addEventListener('click', () => {
      if (del.dataset.sure) { draft.faqs = draft.faqs.filter((x) => x.id !== d.id); dlg().close(); mark(); return; }
      del.dataset.sure = '1'; del.textContent = 'Tocá otra vez para eliminar';
    });
  }

  // =====================================================================
  //  router y estructura
  // =====================================================================
  function route() {
    const my = ++navId; closeMenu(); closeSearch();
    const key = location.hash.replace(/^#/, '') || 'inicio';
    const entering = key !== lastKey;
    let m;
    try {
      if (key === 'inicio') pageHome();
      else if (key === 'iphone' || key === 'ofertas' || key === 'accesorios') pageCatalog(key, entering);
      else if ((m = /^producto-(\d+)$/.exec(key))) pageProduct(Number(m[1]));
      else if (key === 'favoritos') pageFavs();
      else if (key === 'carrito') pageCart();
      else if (key === 'pedir') pageOrder();
      else if (key === 'pedido') pageOrderDone();
      else if (key === 'como-comprar') pageHow();
      else if (key === 'contacto') pageContact();
      else if (key === 'faq') pageFaq();
      else if (key === 'vender' || key === 'permutar') pageSell(key === 'permutar' ? 'permuta' : 'venta');
      else if (key === 'vender-listo') pageSellDone();
      else if (key === 'editar') pageAdmin();
      else setPage(html`<div class="wrap section">${emptyBox('La página que buscás no existe', 'Volvé al inicio para seguir mirando.', html`<br><a class="btn" href="#inicio">Ir al inicio</a>`)}</div>`, 'No encontrada', '');
    } catch (e) { console.error(e); setPage(html`<div class="wrap section">${emptyBox('No pudimos mostrar esta página', 'Probá de nuevo en unos segundos.', html`<br><a class="btn" href="#inicio">Ir al inicio</a>`)}</div>`, 'Error', ''); }
    if (entering) window.scrollTo(0, 0);
    const fab = $('#edit-fab'); if (fab) fab.classList.toggle('on-admin', key === 'editar');
    lastKey = key; void my;
  }

  function closeMenu() { const m = $('#mobile-menu'); if (m) { m.classList.remove('open'); $('#btn-menu').setAttribute('aria-expanded', 'false'); } }
  function closeSearch() { const sp = $('#search-panel'); if (sp) sp.classList.remove('open'); }

  function shell() {
    const s = cfg();
    $('#root').innerHTML = html`
      <header class="site-header"><div class="wrap">
        <a class="brand" href="#inicio" aria-label="${s.business_name}, ir al inicio"><img src="${LOGO}" alt="" width="38" height="38"><span>${s.business_name}</span></a>
        <nav class="nav" aria-label="Principal"><a href="#inicio" data-nav="inicio">Inicio</a><a href="#iphone" data-nav="iphone">Comprar iPhone</a><a href="#ofertas" data-nav="ofertas">Ofertas</a><a href="#accesorios" data-nav="accesorios">Accesorios</a><a href="#vender" data-nav="vender">Vendé o permutá</a><a href="#como-comprar" data-nav="como-comprar">Cómo comprar</a><a href="#contacto" data-nav="contacto">Contacto</a></nav>
        <div class="header-actions">
          <button class="icon-btn" id="btn-search" aria-label="Buscar">${raw(I.search)}</button>
          <a class="icon-btn" href="#favoritos" aria-label="Favoritos">${raw('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2Z"/></svg>')}<span class="badge" id="fav-count" hidden>0</span></a>
          <a class="icon-btn" href="#carrito" aria-label="Carrito" id="btn-cart">${raw(I.bag)}<span class="badge" id="cart-count" hidden>0</span></a>
          <button class="icon-btn menu-btn" id="btn-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu">${raw(I.menu)}</button></div></div></header>
      <div class="mobile-menu" id="mobile-menu"><a href="#inicio">Inicio</a><a href="#iphone">Comprar iPhone</a><a href="#ofertas">Ofertas</a><a href="#accesorios">Accesorios</a><a href="#vender">Vendé o permutá tu iPhone</a><a href="#como-comprar">Cómo comprar</a><a href="#contacto">Contacto</a>
        <div class="mm-contact"><a class="btn btn-wa" href="${waLink('Hola! Quiero hacer una consulta.')}" target="_blank" rel="noopener">${raw(I.wa)} WhatsApp</a></div></div>
      <div class="search-panel" id="search-panel" role="dialog" aria-modal="true" aria-label="Buscar productos"><div class="search-box">
        <div class="search-row">${raw(I.search)}<input id="search-input" type="search" placeholder="Buscá un modelo, color o capacidad" autocomplete="off" enterkeyhint="search"><button class="btn btn-soft btn-sm" id="search-close" type="button">Cerrar</button></div>
        <div class="search-results" id="search-results"></div></div></div>
      <main id="view" tabindex="-1"></main>
      <footer class="site-footer"><div class="wrap"><div class="foot">
        <div><div class="brand"><img src="${LOGO}" alt="" width="38" height="38"><span>${s.business_name}</span></div><p>${s.location}. Venta de iPhone.</p></div>
        <div><h3>Tienda</h3><a href="#iphone">Comprar iPhone</a><a href="#ofertas">Ofertas</a><a href="#accesorios">Accesorios</a><a href="#vender">Vendé tu iPhone</a><a href="#permutar">Permutá tu iPhone</a><a href="#favoritos">Favoritos</a></div>
        <div><h3>Ayuda</h3><a href="#como-comprar">Cómo comprar</a><a href="#faq">Preguntas frecuentes</a><a href="#contacto">Contacto</a>
          <a href="${waLink('')}" target="_blank" rel="noopener">WhatsApp ${s.whatsapp}</a><a href="${s.instagram_url}" target="_blank" rel="noopener">Instagram ${s.instagram}</a></div></div>
        <div class="copy">© ${new Date().getFullYear()} ${s.business_name}. Los precios y la disponibilidad pueden cambiar sin aviso.</div></div></footer>
      <a class="wa-float" href="${waLink('Hola! Quiero hacer una consulta.')}" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">${raw(I.wa)}</a>
      <a class="edit-fab" id="edit-fab" href="#editar" hidden>${raw(I.edit)} Editar tienda</a>
      <dialog id="dlg" class="a-dialog"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>`.s;
    $('#btn-menu').addEventListener('click', () => { const open = $('#mobile-menu').classList.toggle('open'); $('#btn-menu').setAttribute('aria-expanded', String(open)); });
    const sp = $('#search-panel'); const si = $('#search-input'); const sr = $('#search-results'); const hint = '<div class="search-hint">Escribí el modelo, la capacidad o el color.</div>';
    $('#btn-search').addEventListener('click', () => { sp.classList.add('open'); si.value = ''; sr.innerHTML = hint; setTimeout(() => si.focus(), 30); });
    $('#search-close').addEventListener('click', closeSearch);
    sp.addEventListener('click', (e) => { if (e.target === sp) closeSearch(); });
    si.addEventListener('input', () => {
      const q = si.value.trim(); if (q.length < 2) { sr.innerHTML = hint; return; }
      const L = listProducts({ q, limit: 6 });
      sr.innerHTML = (L.length ? html`${L.map((p) => html`<a class="search-item" href="#producto-${p.id}"><span class="thumb">${p.images[0] ? html`<img src="${p.images[0]}" alt="">` : raw(phoneBack(p.color))}</span><span><b>${p.name}</b><span>${[p.storage, p.color].filter(Boolean).join(' · ')} · ${money(p.price, p.currency)}</span></span></a>`)}` : html`<div class="search-hint">No encontramos resultados para “${q}”.</div>`).s;
    });
    si.addEventListener('keydown', (e) => { if (e.key === 'Enter' && si.value.trim()) { pendingF = { q: si.value.trim() }; closeSearch(); if (location.hash === '#iphone') { lastKey = ''; route(); } else location.hash = 'iphone'; } });
    const d = dlg(); d.addEventListener('click', (e) => { if (e.target.closest('[data-close]') || e.target === d) d.close(); });
    updateBadges();
    if (isEditor) { $('#edit-fab').hidden = false; updateFab(); }
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSearch(); closeMenu(); } });
  document.addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]'); if (add) { e.preventDefault(); addToCart(Number(add.dataset.add)); return; }
    const fav = e.target.closest('[data-fav]');
    if (fav) { e.preventDefault(); const id = Number(fav.dataset.fav); const on = toggleFav(id); if (!on && location.hash === '#favoritos') pageFavs(); return; }
    const cq = e.target.closest('[data-cq]');
    if (cq) { const id = Number(cq.dataset.cq); const l = cart.find((x) => x.id === id); const p = byId(id); if (l) { l.qty = Math.max(1, Math.min(p ? p.stock : 1, l.qty + Number(cq.dataset.d))); saveCart(); renderCart(); } return; }
    const rm = e.target.closest('[data-rm]'); if (rm) { cart = cart.filter((x) => x.id !== Number(rm.dataset.rm)); saveCart(); renderCart(); return; }
    const used = e.target.closest('[data-used]'); if (used) { pendingF = { cond: 'usado' }; return; }
    // modo edición
    const tb = e.target.closest('[data-tab]'); if (tb && draft) { tab = tb.dataset.tab; renderAdmin(); return; }
    if (e.target.closest('#new-p')) { productDialog(null); return; }
    const ed = e.target.closest('[data-edit]'); if (ed && draft) { productDialog(draft.products.find((x) => x.id === Number(ed.dataset.edit))); return; }
    if (e.target.closest('#new-f')) { faqDialog(null); return; }
    const fq = e.target.closest('[data-f]'); if (fq && draft) { faqDialog(draft.faqs.find((x) => x.id === Number(fq.dataset.f))); return; }
    if (e.target.closest('#a-publish')) { publish(); return; }
    if (e.target.closest('#a-discard')) { draft = clone(S); dirty = false; renderAdmin(); return; }
    if (e.target.closest('#r-reload')) { loadReqs(); renderAdmin(); return; }
    const rph = e.target.closest('[data-rph]');
    if (rph) { photoUrl(rph.dataset.rph).then((u) => openDialog('Foto', html`<img src="${u}" alt="Foto del iPhone" style="width:100%;border-radius:12px">`, '')).catch(() => toast('No se pudo abrir la foto.')); return; }
    const rdel = e.target.closest('[data-rdel]');
    if (rdel) {
      if (!rdel.dataset.sure) { rdel.dataset.sure = '1'; rdel.textContent = 'Tocá otra vez para borrar'; return; }
      const id = rdel.dataset.rdel; rdel.disabled = true;
      api('/requests/' + id, { method: 'DELETE' }).then(() => { reqs = reqs.filter((x) => x.id !== id); updateFab(); renderAdmin(); toast('Solicitud borrada.'); })
        .catch((ex) => { rdel.disabled = false; toast(ex.message || 'No se pudo borrar.'); });
      return;
    }
    if (e.target.closest('#a-logout')) {
      if (dirty && !e.target.closest('#a-logout').dataset.sure) { const b = e.target.closest('#a-logout'); b.dataset.sure = '1'; b.textContent = 'Hay cambios sin publicar. Tocá otra vez para salir'; return; }
      setToken(''); disableServerEditor(); draft = null; dirty = false; location.hash = 'inicio'; toast('Cerraste sesión.'); return;
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-edit],[data-f]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', (e) => {
    const sel = e.target.closest && e.target.closest('[data-rst]'); if (!sel) return;
    const id = sel.dataset.rst; const r = reqs && reqs.find((x) => x.id === id); if (!r) return;
    const prev = r.status; r.status = sel.value; sel.disabled = true;
    api('/requests/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: sel.value }) })
      .then(() => { updateFab(); renderAdmin(); toast('Estado guardado.'); })
      .catch((ex) => { r.status = prev; renderAdmin(); toast(ex.message || 'No se pudo guardar el estado.'); });
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- arranque ----------
  shell(); route();
  // Capacidades del visor: llegan después del primer pintado. La tienda funciona sin ellas.
  (async () => {
    if (!API) return;
    // Dominio propio: si este celular ya inició sesión, se muestra "Editar tienda".
    if (getToken()) {
      try { await api('/me'); enableServerEditor(); if (location.hash === '#editar') route(); }
      catch (e) { if (e.status === 401) setToken(''); }
    }
    // Por si la página quedó guardada en caché: se trae el catálogo más reciente.
    try {
      const fresh = await api('/store');
      if (fresh && fresh.products && fresh.updatedAt && fresh.updatedAt !== S.updatedAt && !draft) { S = fresh; shell(); route(); }
    } catch { /* se usa el catálogo que vino en la página */ }
  })();
  (async () => {
    try {
      if (API || !window.claude || !window.claude.use) return;
      const [user, artifact, assets] = await Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('assets')]);
      caps = { artifact, assets };
      isEditor = !!(user && user.canEdit && user.canEdit() && artifact);
      const fab = $('#edit-fab'); if (fab) fab.hidden = !isEditor;
      if (isEditor && ['inicio', 'editar'].includes(location.hash.replace(/^#/, '') || 'inicio')) { lastKey = lastKey; route(); }
    } catch { /* sin capacidades */ }
  })();
})();
</script>
</body></html>
